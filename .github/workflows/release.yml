# Build & release DeepOrca Desktop installers for macOS / Windows / Linux.
#
# Triggers:
#   - push a version tag (v*)   → build all 3 platforms + create a GitHub Release
#   - manual workflow_dispatch  → build all 3 platforms, artifacts only (no release)
#
# Each platform job: npm ci → desktop:build (core + vendored CodeGraph/OpenWiki
# + esbuild bundles) → desktop:package (stage app dir + electron-builder).
# Builds are unsigned (no signing certs configured).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop (core + vendored tools + bundles)
        run: npm run desktop:build

      - name: Package installers
        run: npm run desktop:package
        env:
          # Never attempt macOS code signing on CI.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deeporca-${{ runner.os }}
          if-no-files-found: error
          path: |
            packages/desktop/out/pkg/*.dmg
            packages/desktop/out/pkg/*.zip
            packages/desktop/out/pkg/*.exe
            packages/desktop/out/pkg/*.AppImage
            packages/desktop/out/pkg/*.deb
            packages/desktop/out/pkg/*.blockmap
            packages/desktop/out/pkg/latest*.yml

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
          draft: false
