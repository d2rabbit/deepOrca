name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "docs-site/**"
      - "resources/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare static assets
        run: |
          # Copy resources referenced by the site (screenshots etc.)
          mkdir -p docs-site/assets
          cp -f resources/*.png docs-site/assets/ 2>/dev/null || true
          # Fix image paths in index.html to use local assets
          sed -i 's|\.\./resources/|assets/|g' docs-site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
