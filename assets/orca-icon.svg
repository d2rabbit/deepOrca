<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft shadow filter -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feOffset dy="4" result="offsetBlur" />
      <feMerge>
        <feMergeNode in="offsetBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Badge background gradient (light) -->
    <linearGradient id="bgBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Orca body gradient (sky blue) -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- White belly gradient -->
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Accent gradient (sky → mint) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <!-- Coral accent -->
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
  </defs>

  <!-- ICON CONTAINER BADGE -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgBadgeGrad)" stroke="url(#accentGrad)" stroke-width="3" />

  <!-- Decorative dashed ring (subtle) -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-dasharray="6 10 60 8" opacity="0.25" />

  <!-- GEOMETRIC ORCA -->
  <g id="orca-character" filter="url(#soft-shadow)">

    <!-- Shadow / ground line -->
    <ellipse cx="256" cy="425" rx="120" ry="10" fill="#38bdf8" opacity="0.12" />

    <!-- 1. BACK PECTORAL FIN -->
    <polygon points="175,295 110,350 135,370 195,330" fill="#0284c7" stroke="#0369a1" stroke-width="2" stroke-linejoin="miter" />
    <polyline points="120,352 138,365 180,332" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round" />

    <!-- 2. DORSAL FIN -->
    <g id="dorsal-fin">
      <polygon points="225,185 270,72 320,105 292,202" fill="url(#bodyGrad)" stroke="#0369a1" stroke-width="2" stroke-linejoin="miter" />
      <!-- Fin highlight -->
      <polygon points="270,72 320,105 285,150" fill="url(#accentGrad)" opacity="0.25" />
      <!-- Leading edge accent -->
      <polyline points="225,185 270,72 320,105" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linejoin="miter" stroke-miterlimit="4" />
      <!-- Vent grooves -->
      <line x1="250" y1="145" x2="275" y2="125" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round" />
      <line x1="262" y1="168" x2="287" y2="148" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- 3. TAIL ASSEMBLY -->
    <g id="tail-assembly">
      <!-- Tail stock -->
      <polygon points="350,280 405,255 425,278 372,310" fill="url(#bodyGrad)" stroke="#0369a1" stroke-width="2" stroke-linejoin="miter" />
      <!-- Top fluke -->
      <polygon points="405,255 465,175 445,235 420,250" fill="url(#bodyGrad)" stroke="#0369a1" stroke-width="2" stroke-linejoin="miter" />
      <polyline points="405,255 465,175 445,235" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" />
      <!-- Bottom fluke -->
      <polygon points="420,250 480,268 435,282 410,270" fill="url(#bodyGrad)" stroke="#0369a1" stroke-width="2" stroke-linejoin="miter" />
      <polyline points="420,250 480,268 435,282" fill="none" stroke="url(#coralGrad)" stroke-width="2" stroke-linecap="round" />
      <!-- Tail accent dot -->
      <circle cx="415" cy="258" r="3.5" fill="#fda4af" />
    </g>

    <!-- 4. MAIN BODY (low-poly) -->
    <polygon id="orca-main-body" points="80,255 145,200 240,175 325,195 380,240 372,310 280,345 185,335 110,305"
             fill="url(#bodyGrad)"
             stroke="#0369a1"
             stroke-width="2.5"
             stroke-linejoin="miter" />

    <!-- Body facet lines (subtle) -->
    <g stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.2" fill="none">
      <line x1="80" y1="255" x2="240" y2="175" />
      <line x1="145" y1="200" x2="185" y2="335" />
      <line x1="240" y1="175" x2="280" y2="345" />
      <line x1="325" y1="195" x2="372" y2="310" />
    </g>

    <!-- 5. WHITE BELLY PATCH -->
    <polygon id="orca-belly" points="105,282 170,270 260,278 355,275 330,320 250,335 160,322"
             fill="url(#bellyGrad)"
             stroke="#bae6fd"
             stroke-width="1" />

    <!-- 6. EYE PATCH (signature orca spot) -->
    <polygon id="eye-patch" points="140,218 195,205 210,225 160,238" fill="#ffffff" fill-opacity="0.95" stroke="#6ee7b7" stroke-width="1.5" />

    <!-- 7. EYE (simple, friendly) -->
    <g id="eye-group">
      <!-- Eye base -->
      <ellipse cx="153" cy="245" rx="10" ry="8" fill="#1e293b" />
      <!-- Pupil highlight -->
      <circle cx="155" cy="243" r="3" fill="#38bdf8" />
      <circle cx="156" cy="242" r="1.2" fill="#ffffff" />
    </g>

    <!-- 8. FRONT PECTORAL FIN -->
    <g id="front-flipper">
      <polygon points="215,310 170,380 210,395 255,330" fill="url(#bodyGrad)" stroke="#0369a1" stroke-width="2" stroke-linejoin="miter" />
      <polyline points="215,310 170,380 210,395" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="190" cy="387" r="3" fill="#6ee7b7" />
    </g>

    <!-- 9. Spine accent line -->
    <polyline points="80,255 145,200 240,175 325,195 380,240" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />

  </g>
</svg>
