<svg id="svg-blue-whale" xmlns="http://www.w3.org/2000/svg" viewBox="40 30 860 350">
  <defs>
    <!-- Blue Whale Skin Gradient -->
    <linearGradient id="whaleSkin" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#4a6a8c"></stop>
      <stop offset="30%" stop-color="#2b4a68"></stop>
      <stop offset="75%" stop-color="#12283f"></stop>
      <stop offset="100%" stop-color="#081a2c"></stop>
    </linearGradient>

    <!-- Pale Underside Gradient -->
    <linearGradient id="whaleBelly" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c3d4e3"></stop>
      <stop offset="80%" stop-color="#9db3c7"></stop>
      <stop offset="100%" stop-color="#7d97ac"></stop>
    </linearGradient>

    <filter id="whaleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"></feDropShadow>
    </filter>
  </defs>

  <!-- elongated & flattened versus the orca: long rorqual body -->
  <g id="whale-main-group" filter="url(#whaleShadow)" transform="translate(-160 10) scale(1.3 0.88)">

    <!-- Main body (orca geometry, stretched) -->
    <path id="whale-part-body" d="M 180 260
           C 200 230, 240 185, 320 180
           C 400 175, 510 195, 600 240
           C 650 265, 700 282, 735 280
           C 750 278, 765 268, 775 250
           C 772 280, 768 298, 788 322
           C 765 310, 742 310, 700 300
           C 590 325, 460 340, 360 320
           C 270 302, 210 285, 175 272
           C 165 268, 168 262, 180 260 Z" fill="url(#whaleSkin)"></path>

    <!-- Pale underside / throat -->
    <path id="whale-part-belly" d="M 215 273
           C 250 288, 300 305, 370 318
           C 460 332, 540 330, 605 305
           C 638 292, 665 270, 685 278
           C 668 298, 620 322, 545 318
           C 450 312, 360 298, 280 278
           C 245 269, 222 268, 215 273 Z" fill="url(#whaleBelly)" opacity="0.75"></path>

    <!-- Tiny dorsal fin, far back on the body -->
    <path id="whale-part-dorsal" d="M 548 222
           C 554 208, 562 202, 566 203
           C 572 211, 575 221, 576 229
           C 562 228, 553 226, 548 222 Z" fill="url(#whaleSkin)" stroke="#1c3049" stroke-width="0.8"></path>

    <!-- Pectoral flipper -->
    <path id="whale-part-flipper" d="M 320 295
           C 340 325, 365 375, 358 392
           C 353 400, 342 396, 330 376
           C 308 342, 292 312, 296 290 Z" fill="#12283f" stroke="#1c3049" stroke-width="1"></path>

    <!-- Facial details: eye + long mouth seam -->
    <circle cx="228" cy="248" r="2.5" fill="#04101c"></circle>
    <circle cx="229" cy="247.5" r="0.8" fill="#ffffff" opacity="0.8"></circle>
    <path d="M 175 272 C 230 276, 320 282, 420 286" stroke="#04101c" stroke-width="1.5" opacity="0.6" fill="none"></path>
  </g>
</svg>
