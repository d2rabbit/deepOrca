  工作链 HTML 交互视觉稿 · v3（2026-09-07）
  ─────────────────────────────────────────────────────────────
  构建方式: 以 specs/design-systems-advance/designs/screen-ui-design.html 为底稿逐字转换——
  同一套 Aqua token / cockpit / dir-panel(会话模块) / ui-sheet / rev-pill 页签 /
  ver-rail 版本轨 / rp-finding 审查卡 / dd-画布 / ppop 悬浮卡；只把内容层换成工作链注入。
  需求映射（用户澄清 2026-09-07）:
   · 不新增链模块。现有模块：会话任务 / 原型设计 / UI 设计 / 审查报告 / 知识库 / 编辑器 / 任务树。
   · 任务树 = 整个本地 + 链历史：每个链操作在【链操作日志】里加一行（链 id + 操作）；
     任务树节点显示链 id（fork 节点 = 来源链 id）。
   · 会话模块：会话任务落地处；从链上 fork 的会话任务 item 上【声明链 id】。
   · 原型设计 / UI 设计 / 审查报告 / 知识库：在【已有本地版本管理(ver-rail)】基础上
     增加一个【链上版本】（ver-item 带 ⛓ 链上徽章 + 来源链 id）。
   · 编辑器 = chat 变种：构建【本地历史快照】（VSCode/IDEA 式），快照上链 = 链上操作历史快照。
   · fork = checkout 新分支，行为即上链（自动）；merge = cherry-pick（冲突只报告）。
   · 设置只新增一个「开启链共享」开关：关=本地独立；开=自动上链。
  交互演示:
   ① 页签切换：任务树 / 原型设计 / UI 设计 / 审查报告 / 知识库 / 编辑器（现有模块）
   ② 任务树：fork=checkout 新分支（行内 pop：来源断言自动携带 + 域选择 + 审查/知识库锁定）
      → 确认：自动上链 → 会话模块新会话任务（声明链 id）/ 对应模块 ver-rail 新增【链上版本】/
        编辑器新增【链上快照】/ 链操作日志新增一行（链 id + 操作）
   ③ merge（cherry-pick · 冲突只报告）→ 已并入 + 日志行
   ④ 原型/UI 设计：ver-rail 本地版本 + 【链上版本】item（⛓ 链上 · 来源链 id）
   ⑤ 编辑器：本地历史快照时间线 + 链上操作历史快照（⛓ 链 id）
   ⑥ 审查/知识库：rp-finding 同构 + 版本轨链上版本（随代码锁定）
   ⑦ 设置「开启链共享」单开关（关=本地记录标「本地」；开=自动上链）
   ⑧ 浅色/深色 · 深链 #tree/#proto/#ui/#review/#kb/#editor
-->

          ? '<div class="rp-file"><h2><code>src/auth/passkey.ts</code> <span class="cnt">2</span></h2>'
            + '<div class="rp-finding"><div class="head"><span class="chip sev-high">error</span><span class="loc">:42</span></div><div class="body">passkey 验证失败未回滚 session —— 失败路径应清理会话状态。</div></div>'
            + '<div class="rp-finding"><div class="head"><span class="chip sev-medium">warn</span><span class="loc">:8</span></div><div class="body">webauthn 导入未做能力探测 —— 旧浏览器需降级提示。</div></div></div>'
          : '<div class="rp-file"><h2><code>知识条目</code> <span class="cnt">2</span></h2>'
            + '<div class="rp-finding"><div class="head"><b>passkey 注册/验证流程沉淀</b></div><div class="body">12 条相关条目 · 含坑位记录。</div></div>'
            + '<div class="rp-finding"><div class="head"><b>WebAuthn 浏览器兼容矩阵</b></div><div class="body">来自链上协作者补充 · 随代码版本对齐。</div></div></div>')
        + '<div class="rp-footer">与代码强绑定：fork 任务时随代码整体 fork，本模块在已有版本管理上增加<b>链上版本</b>（不生成会话任务）。</div></div>';
    }
    $("sheetBody").innerHTML =
      '<div class="ver-rail" style="height:100%"><div class="rail-cap">' + esc(titles[key]) + " · 版本（本地 + 链上）</div>" + rail + "</div>"
      + '<div class="rev-tab-content" style="flex:1;min-width:0">' + content + "</div>";
    Array.prototype.forEach.call($("sheetBody").querySelectorAll("[data-vi]"), function (el) {
      el.addEventListener("click", function () { verSel[key] = Number(el.dataset.vi); renderVer(key); });
    });
    var vf = $("verFork");
    if (vf) vf.addEventListener("click", function () {
      var a = AREAS.filter(function (x) { return x.domain === (key === "ui" ? "ui" : key === "proto" ? "proto" : key); })[0];
      if (!a) { toast("", "该模块暂无可 fork 的任务树节点", ""); return; }
      selKey = a.key;
      setView("tree");
      pop = { mode: "fork", key: a.key, dom: key === "ui" ? "design" : key === "proto" ? "prototype" : key };
      renderAll();
    });
  }

  function setView(v) {
    view = v;
    Array.prototype.forEach.call(document.querySelectorAll(".rev-pill"), function (b) { b.classList.toggle("active", b.dataset.v === v); });
    Array.prototype.forEach.call(document.querySelectorAll(".s-chip"), function (b) { b.classList.toggle("active", b.dataset.view === v); });
  }

  function renderAll() {
    renderSess();
    if (view === "tree") renderTree();
    else renderVer(view);
    $("scopeHint").textContent = "任务树 = 本地 + 链历史 · 链 id 绑定设备（每设备唯一）· " + (sharedOn ? "链共享已开启：行为自动上链" : "链共享未开启：本地独立");
  }

  function openSettings() {
    $("settingsScrim").innerHTML = '<div class="settings">'
      + '<div class="sh"><h2>⚙ 设置 · 工作链（新增段）</h2><div class="sub">链 id 绑定设备、每设备唯一；任务树承载本地 + 链历史；链路本身为隐藏行为。</div></div>'
      + '<div class="sb">'
      + '<div class="field"><div class="fx"><div class="ft">开启链共享</div><div class="fd">关闭：本地独立（fork / 版本 / 快照仅本地记录）。<b>开启：自动上链</b>——fork / 合并 / 版本 / 快照等行为自动记录上链，无需任何手动共享操作。</div></div><span class="switch' + (sharedOn ? " on" : "") + '" id="swShare"></span></div>'
      + '<div class="field"><div class="fx"><div class="ft">链 id（本设备）</div><div class="fd" style="margin-top:4px;font-family:var(--ui-font-mono)">⛓ ' + esc(DEVICES[MY].chain) + " · 绑定设备 " + esc(DEVICES[MY].name) + "（每设备唯一）</div></div></div>"
      + "</div>"
      + '<div class="sf"><button class="rp-btn gel" id="setClose">完成</button></div></div>';
    $("settingsScrim").classList.add("show");
    $("setClose").addEventListener("click", function () { $("settingsScrim").classList.remove("show"); });
    $("swShare").addEventListener("click", function () {
      sharedOn = !sharedOn;
      openSettings();
      toast(sharedOn ? "ok" : "", sharedOn ? "链共享已开启 —— 行为自动上链" : "链共享已关闭 —— 本地独立", sharedOn ? "fork / 合并 / 版本 / 快照自动记录上链" : "重新开启后恢复自动上链");
      renderAll();
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll(".rev-pill"), function (b) {
    b.addEventListener("click", function () { setView(b.dataset.v); pop = null; renderAll(); });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".s-chip"), function (b) {
    b.addEventListener("click", function () { setView(b.dataset.view); pop = null; renderAll(); });
  });
  $("themeSeg").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    document.documentElement.dataset.appearance = b.dataset.app;
    Array.prototype.forEach.call($("themeSeg").querySelectorAll("button"), function (x) { x.classList.toggle("on", x === b); });
  });
  $("settingsBtn").addEventListener("click", openSettings);
  $("settingsScrim").addEventListener("click", function (e) { if (e.target === $("settingsScrim")) $("settingsScrim").classList.remove("show"); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { pop = null; $("settingsScrim").classList.remove("show"); renderAll(); }
  });
  (function () {
    var h = location.hash.replace("#", "");
    if (["tree", "proto", "ui", "review", "kb", "editor"].indexOf(h) >= 0) setView(h);
  })();

  renderAll();
})();
</script>
</body>
</html>
