# format mirrors knowledge/evals/cases/*.yaml (Workstream A, skill-up CI)
id: arch-scan-positive
title: Architecture scan request produces a Mermaid map, not A2UI surfaces
description: >
  User asks for an architecture scan of the current repository. arch-scan
  should trigger and persist a Mermaid document via save_archmap
  (.deeporca/prototypes/arch-<name>.md) — real nodes/edges diagrams rendered
  in the Knowledge panel, no external CLI, no A2UI surface output (the legacy
  shape rendered as a flat document).
input:
  prompt: |
    扫描一下当前这个仓库的整体架构，画一张架构图，重点标出核心模块
    和它们之间的依赖关系。
constraints:
  timeout_seconds: 600
  max_turns: 15
expect:
  must_contain:
    - "save_archmap"
    - "mermaid"
    - "架构分析"
  must_not_contain:
    - "render_surface"
judge:
  type: rule_based
