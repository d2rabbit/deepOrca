# format mirrors knowledge/evals/cases/*.yaml (Workstream A, skill-up CI)
id: arch-scan-positive
title: Architecture scan request authors an archify typed-IR map
description: >
  User asks for an architecture scan of the current repository. arch-scan
  should trigger and author an archify typed-IR artifact
  (.deeporca/prototypes/arch-<slug>.<type>.json) with the write tool —
  the deterministic host deliver gate renders it into a validated
  self-contained HTML shown in the Knowledge panel. No Mermaid documents,
  no A2UI surfaces (both retired 2026-08-29).
input:
  prompt: |
    扫描一下当前这个仓库的整体架构，画一张架构图，重点标出核心模块
    和它们之间的依赖关系。
constraints:
  timeout_seconds: 600
  max_turns: 15
expect:
  must_contain:
    - "arch-"
    - ".architecture.json"
    - "write"
  must_not_contain:
    - "save_archmap"
    - "render_surface"
judge:
  type: rule_based
